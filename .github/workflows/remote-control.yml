name: Build LiveContainer (remote-control)

on:
  push:
    branches: [remote-control]
  pull_request:
    branches: [remote-control]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA (unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Toolchain info
        run: |
          set -x
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -list -project LiveContainer.xcodeproj | head -40

      - name: Archive
        id: archive
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/rc"
          LOG="$RUNNER_TEMP/rc/xcodebuild.log"
          xcodebuild archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -archivePath "$PWD/build/LiveContainer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$LOG" 2>&1
          rc=$?
          echo "xcodebuild rc=$rc"
          exit $rc

      - name: Package IPA
        if: success()
        run: |
          set -euo pipefail
          APP=$(find build/LiveContainer.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry LiveContainer-remote.ipa Payload)
          ls -lh out/LiveContainer-remote.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-remote-ipa
          path: out/LiveContainer-remote.ipa
          if-no-files-found: error

      # ── 把结果写进 ci-logs 分支 ─────────────────────────────────────────
      # 这台开发机（与 CI 同一出口 IP）的 api.github.com 匿名额度经常打满，
      # 读不到 run 状态；用 git 把结论+编译错误回传，git 协议不受限。
      - name: Publish status to ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/rc/xcodebuild.log"
          REPORT="$RUNNER_TEMP/rc/status.txt"
          {
            echo "run: $GITHUB_RUN_ID"
            echo "sha: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            echo "job_status: ${{ job.status }}"
            echo "archive_outcome: ${{ steps.archive.outcome }}"
            echo
            echo "===== error: lines ====="
            grep -n "error:" "$LOG" 2>/dev/null | head -60 || echo "(none)"
            echo
            echo "===== log tail (400) ====="
            tail -400 "$LOG" 2>/dev/null || echo "(no log)"
          } > "$REPORT"

          cd "$GITHUB_WORKSPACE"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs-report-tmp || true
          git rm -rf . --quiet >/dev/null 2>&1 || true
          cp "$REPORT" ./status.txt
          git add -A status.txt
          git commit -q -m "ci: run $GITHUB_RUN_ID (${{ job.status }})" || echo "nothing to commit"
          git push --force origin HEAD:ci-logs >/dev/null 2>&1 && echo "status published to ci-logs" || echo "failed to publish status"
